services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - museum-data:/app/data
      - museum-backups:/app/backups
    expose:
      - "4317"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 20s
  backup:
    build: .
    command: ["node", "scripts/scheduled-backup.js"]
    restart: "on-failure:3"
    init: true
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_PATH: /app/data/museum.sqlite
      BACKUP_DIR: /app/backups
    volumes:
      - museum-data:/app/data
      - museum-backups:/app/backups
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 64
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  museum-data:
  museum-backups:
  caddy-data:
  caddy-config:
